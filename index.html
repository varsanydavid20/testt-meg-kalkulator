<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI-kalkulátor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="kulso-doboz">

        <div class="kalkulator">

            <h1>BMI-kalkulátor</h1>

            <div class="sor">
                <label for="magassag">Magasság (cm)</label>
                <input type="number" id="magassag" min="1">
            </div>

            <div class="sor">
                <label for="testsuly">Testsúly (kg)</label>
                <input type="number" id="testsuly" min="1">
            </div>

            <button type="button" id="szamitasGomb">
                Számítás!
            </button>

            <div id="eredmeny"></div>

        </div>

    </div>

    <script src="./script.js"></script>

</body>
</html>
